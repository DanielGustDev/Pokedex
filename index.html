<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <link rel="shortcut icon" href="assets/icons/pokéball-favicon.svg" type="image/x-icon">

    <meta name="description" content="An interactive Pokédex, search for Pokémon and explore Pokémon-Data.">
    <meta name="format-detection" content="telephone=no">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Pokédex">
    <meta property="og:description" content="Explore and search all Pokémon in this interactive Pokédex.">
    <meta property="og:image" content="assets/icons/pokéball-favicon.svg">

    <meta name="theme-color" content="#e3350d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pokédex">

    <script src="scripts/templates.js"></script>
    <script src="script.js"></script>

    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/assets.css">
    <link rel="stylesheet" href="styles/standards.css">
    <link rel="stylesheet" href="style.css">
</head>

<body onload="loadData()">
    <div class="red-frame">
        <header>
            <div class="header-top">
                <div class="lense-and-lights">
                    <div class="big-blue-lens">
                        <div class="lens-reflection"></div>
                    </div>
                    <div class="traffic-lights">
                        <span class="light red"></span>
                        <span class="light yellow"></span>
                        <span class="light green"></span>
                    </div>
                    <div class="headline">
                        <button class="home-button" aria-label="Back to mainpage" onclick="resetToMainView()">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                                <!-- Outer Circle -->
                                <circle cx="50" cy="50" r="45" fill="none" stroke="#FFFFFF" stroke-width="6" />

                                <!-- lower darker half -->
                                <line x1="5" y1="50" x2="95" y2="50" stroke="#FFFFFF" stroke-width="6" />

                                <!-- Center Circle -->
                                <circle cx="50" cy="50" r="16" fill="none" stroke="#FFFFFF" stroke-width="6" />

                                <!-- Center Dott -->
                                <circle cx="50" cy="50" r="7" fill="#FFFFFF" />
                            </svg>
                        </button>
                        <h1>Pokédex</h1>
                    </div>
                </div>
            </div>
            <form class="search-form" onsubmit="handleSearch(event)">
                <fieldset class="header-bottom">
                    <legend>Search Pokémon</legend>
                    <input type="search" class="pokedex-search" data-id="search-input"
                        aria-label="input Pokémon to search">
                    <button type="submit" class="search-button" data-id="search-button" aria-label="Search Pokémon"
                        onmousedown="event.preventDefault(); handleSearch();">Search</button>
                </fieldset>
            </form>
            <svg class="header-step-line" viewBox="0 0 500 110" preserveAspectRatio="none">
                <path d="M 500 77 L 225 77 L 175 110 L 0 110" fill="none" stroke="rgba(40, 0, 0, 0.85)" stroke-width="4"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </header>
        <main class="pokedex-screen" data-id="content">
            <section class="card-grid">
            </section>
        </main>
        <dialog id="pokemon_dialog" class="pokemon-dialog" data-id="dialog" aria-labelledby="dialog-title"
            aria-modal="true" onclick="this.close()">
        </dialog>
        <footer>
            <div class="footer-controls">
                <select id="limit_selector" onchange="changeLimit(this.value)">
                    <option value="30" selected>30</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
                <button onclick="handleFooterButtonClick()" class="load-more-button" id="load_more_button"
                    data-id="load-more-button">Load
                    More</button>
            </div>
        </footer>
    </div>
    <div id="loading_popover" class="loading-spinner-wrapper" popover="manual" role="status" aria-live="polite"
        aria-label="Loading Pokémon">
        <div class="loading-popover-content">
            <h3>Loading Pokèmon...</h3>
            <svg class="loading-spinner" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="6" />
                <line x1="5" y1="50" x2="95" y2="50" stroke="#1A1A1A" stroke-width="6" />
                <circle cx="50" cy="50" r="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="6" />
                <circle cx="50" cy="50" r="7" fill="#1A1A1A" />
            </svg>
        </div>
    </div>
    <button id="scroll_to_top" class="scroll-top-button" aria-label="Scroll back to Top" onclick="scrollToTop()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32">
            <g id="arrow-up" fill="#000000">
                <rect x="7" y="4" width="2" height="1" />
                <rect x="6" y="5" width="4" height="1" />
                <rect x="5" y="6" width="6" height="1" />
                <rect x="4" y="7" width="8" height="1" />
                <rect x="7" y="8" width="2" height="4" />
            </g>
        </svg>
    </button>
</body>

</html>
