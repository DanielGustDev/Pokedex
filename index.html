<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <script src="script.js"></script>
    <script src="./scripts/tepmlates.js"></script>


    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/assets.css">
    <link rel="stylesheet" href="styles/standards.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="red-frame">
        <header>
            <div class="header-content">
                <div class="lense-and-lights">
                    <div class="big-blue-lens">
                        <div class="lens-reflection"></div>
                    </div>
                    <div class="traffic-lights">
                        <span class="light red"></span>
                        <span class="light yellow"></span>
                        <span class="light green"></span>
                    </div>
                    <div class="headline">
                        <h1>Pokedex</h1>
                    </div>
                </div>
                <input type="text" class="pokedex-search" placeholder="search Pokemon...">
            </div>
            <svg class="header-step-line" viewBox="0 0 500 110" preserveAspectRatio="none">
                <path d="M 500 77 L 225 77 L 175 110 L 0 110" fill="none" stroke="rgba(40, 0, 0, 0.85)" stroke-width="4"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </header>
        <main class="pokedex-screen">
            <section class="card-grid">
                <div class="pokemon-card"></div>
            </section>
        </main>

        <footer></footer>
    </div>
</body>

</html>
