<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <link rel="shortcut icon" href="assets/icons/pokéball.svg" type="image/x-icon">

    <script src="scripts/templates.js"></script>
    <script src="script.js"></script>

    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/assets.css">
    <link rel="stylesheet" href="styles/standards.css">
    <link rel="stylesheet" href="style.css">
</head>

<body onload="loadData()">
    <div class="red-frame">
        <header>
            <div class="header-top">
                <div class="lense-and-lights">
                    <div class="big-blue-lens">
                        <div class="lens-reflection"></div>
                    </div>
                    <div class="traffic-lights">
                        <span class="light red"></span>
                        <span class="light yellow"></span>
                        <span class="light green"></span>
                    </div>
                    <div class="headline">
                        <button class="home-button" onclick="resetToMainView()">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                                <!-- Outer Circle -->
                                <circle cx="50" cy="50" r="45" fill="none" stroke="#FFFFFF" stroke-width="6" />

                                <!-- lower darker half -->
                                <line x1="5" y1="50" x2="95" y2="50" stroke="#FFFFFF" stroke-width="6" />

                                <!-- Center Circle -->
                                <circle cx="50" cy="50" r="16" fill="none" stroke="#FFFFFF" stroke-width="6" />

                                <!-- Center Dott -->
                                <circle cx="50" cy="50" r="7" fill="#FFFFFF" />
                            </svg>
                        </button>
                        <h1>Pokédex</h1>
                    </div>
                </div>
            </div>

            <fieldset class="header-bottom">
                <legend class="pokemon-search">Search Pokémon</legend>
                <input type="search" class="pokedex-search" data-id="search-input">
                <button class="search-button" data-id="search-button" aria-label="Search Pokémon">Search</button>
            </fieldset>

            <svg class="header-step-line" viewBox="0 0 500 110" preserveAspectRatio="none">
                <path d="M 500 77 L 225 77 L 175 110 L 0 110" fill="none" stroke="rgba(40, 0, 0, 0.85)" stroke-width="4"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </header>
        <main class="pokedex-screen" data-id="content">
            <section class="card-grid">
            </section>
        </main>
        <dialog id="pokemon_dialog" class="pokemon-dialog" data-id="dialog" aria-labelledby="dialog-title"
            aria-modal="true" onclick="this.close()">
            <div id="modal_body" data-id="overlay-pokemon-name" onclick="event.stopPropagation()"></div>
        </dialog>
        <footer>
            <div class="footer-controls">
                <select id="limit_selector" onchange="changeLimit(this.value)">
                    <option value="30" selected>30</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
                <button onclick="handleFooterButtonClick()" class="load-more-button" id="load_more_button"
                    data-id="load-more-button">Load
                    More</button>
            </div>
        </footer>
    </div>
    <div id="loading_popover" class="loading-spinner-wrapper" popover="manual" role="status" aria-live="polite"
        aria-label="Loading Pokémon">
        <div class="loading-popover-content">
            <h3>Loading Pokèmon...</h3>
            <svg class="loading-spinner" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="6" />
                <line x1="5" y1="50" x2="95" y2="50" stroke="#1A1A1A" stroke-width="6" />
                <circle cx="50" cy="50" r="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="6" />
                <circle cx="50" cy="50" r="7" fill="#1A1A1A" />
            </svg>
        </div>
    </div>
</body>

</html>
