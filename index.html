<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <link rel="shortcut icon" href="assets/icons/pokéball.svg" type="image/x-icon">

    <script src="script.js"></script>
    <script src="scripts/templates.js"></script>


    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/assets.css">
    <link rel="stylesheet" href="styles/standards.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="red-frame">
        <header>
            <div class="header-top">
                <div class="lense-and-lights">
                    <div class="big-blue-lens">
                        <div class="lens-reflection"></div>
                    </div>
                    <div class="traffic-lights">
                        <span class="light red"></span>
                        <span class="light yellow"></span>
                        <span class="light green"></span>
                    </div>
                    <div class="headline">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                            <!-- Äußerer weißer Kreis (Grundform) -->
                            <circle cx="50" cy="50" r="45" fill="none" stroke="#FFFFFF" stroke-width="6" />

                            <!-- Untere Hälfte leicht abgedunkelt/transparent hervorgehoben oder durchgehende Trennlinie -->
                            <line x1="5" y1="50" x2="95" y2="50" stroke="#FFFFFF" stroke-width="6" />

                            <!-- Äußerer Ring des mittleren Knopfs -->
                            <circle cx="50" cy="50" r="16" fill="none" stroke="#FFFFFF" stroke-width="6" />

                            <!-- Innerer Auslöseknopf -->
                            <circle cx="50" cy="50" r="7" fill="#FFFFFF" />
                        </svg>
                        <h1>Pokédex</h1>
                    </div>
                </div>
            </div>

            <div class="header-bottom">
                <input type="text" class="pokedex-search" placeholder="search Pokémon...">
            </div>

            <svg class="header-step-line" viewBox="0 0 500 110" preserveAspectRatio="none">
                <path d="M 500 77 L 225 77 L 175 110 L 0 110" fill="none" stroke="rgba(40, 0, 0, 0.85)" stroke-width="4"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </header>
        <main class="pokedex-screen">
            <section class="card-grid">
                <div class="pokemon-card"></div>
            </section>
        </main>

        <footer></footer>
    </div>
</body>

</html>
